[project]
name = "dirty-swapping"
version = "0.1.0"
description = "Training-free counterfactual KV cache swapping for text QA"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.6.0",
  "transformers==4.57.1",
  "huggingface-hub>=0.34,<1",
  "math-verify>=0.8,<1",
  "pyarrow>=19,<24",
]

[project.scripts]
dirty-swapping = "dirty_swapping.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dirty_swapping"]

[tool.uv]
required-version = ">=0.8"

[dependency-groups]
dev = ["ruff==0.13.2"]
